name: collect

on:
  schedule:
    # every hour at minute 17, the top of the hour is the most crowded
    - cron: "17 * * * *"
  workflow_dispatch:

# two collections must never run at once, they would fight over the same offset
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEYWORDS_JSON: ${{ secrets.KEYWORDS_JSON }}
          